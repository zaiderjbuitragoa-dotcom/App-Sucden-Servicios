<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sucden Colombia — Acceso al Sistema de Trazabilidad</title>
  <link rel="stylesheet" href="src/styles/main.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #F8FAFC;
      display: flex;
    }
    .login-container {
      display: flex;
      width: 100vw;
      min-height: 100vh;
    }
    /* Panel Izquierdo: Hero Imagen de Café */
    .login-hero {
      flex: 1.2;
      background: linear-gradient(135deg, rgba(7,14,26,0.82) 0%, rgba(15,30,54,0.88) 100%), 
                  url('src/assets/coffee_bg.png') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4rem 3rem;
      color: #FFFFFF;
      position: relative;
    }
    .hero-brand {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    .hero-logo-svg {
      width: 64px;
      height: 64px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    }
    .hero-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      line-height: 1.1;
    }
    .hero-subtitle {
      font-size: 0.85rem;
      color: #94A3B8;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 4px;
    }
    .hero-footer-text {
      font-size: 1.5rem;
      font-weight: 300;
      line-height: 1.4;
      max-width: 500px;
      color: #E2E8F0;
    }
    .hero-footer-text strong {
      font-weight: 700;
      color: #F59E0B;
    }

    /* Panel Derecho: Formulario Blanco */
    .login-form-wrapper {
      flex: 1;
      max-width: 520px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3.5rem 3rem;
      box-shadow: -10px 0 30px rgba(0,0,0,0.05);
    }
    .form-header {
      margin-bottom: 2rem;
    }
    .form-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #0F172A;
    }
    .form-subtitle {
      font-size: 0.875rem;
      color: #64748B;
      margin-top: 0.25rem;
    }
    .auth-tabs {
      display: flex;
      background: #F1F5F9;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 1.5rem;
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: #64748B;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .auth-tab.active {
      background: #FFFFFF;
      color: #0F1E36;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.375rem;
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.9375rem;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      background: #FFFFFF;
      color: #0F172A;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .form-input:focus {
      border-color: #2563EB;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .btn-submit {
      width: 100%;
      padding: 0.875rem;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #FFFFFF;
      background: #0F1E36;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover {
      background: #162A45;
    }
    .btn-google {
      width: 100%;
      padding: 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #334155;
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 1rem;
      transition: background 0.2s ease;
    }
    .btn-google:hover {
      background: #F8FAFC;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #94A3B8;
      font-size: 0.75rem;
      margin: 1.25rem 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #E2E8F0;
    }
    .divider::before { margin-right: .5em; }
    .divider::after { margin-left: .5em; }

    @media (max-width: 900px) {
      .login-hero { display: none; }
      .login-form-wrapper { max-width: 100%; }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- Panel Izquierdo Hero Imagen de Café -->
    <div class="login-hero">
      <div class="hero-brand">
        <!-- SVG Logo Sucden Colombia -->
        <svg class="hero-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" fill="#0F1E36" stroke="#D97706" stroke-width="4"/>
          <path d="M50 20C35 30 30 50 45 75C60 50 65 30 50 20Z" fill="#D97706"/>
          <path d="M50 20C65 30 70 50 55 75C40 50 35 30 50 20Z" fill="#22C55E" opacity="0.85"/>
          <path d="M48 25L52 70" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="hero-title">Sucden Colombia</div>
          <div class="hero-subtitle">Exportadora de Café S.A.S.</div>
        </div>
      </div>

      <div class="hero-footer-text">
        De la finca al mundo, con <strong>calidad, trazabilidad y pasión.</strong>
      </div>
    </div>

    <!-- Panel Derecho Formulario Blanco -->
    <div class="login-form-wrapper">
      <div class="form-header">
        <h2 class="form-title">Bienvenido</h2>
        <p class="form-subtitle">Inicia sesión o crea tu cuenta para continuar</p>
      </div>

      <!-- Pestañas Acceso / Registro -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Iniciar sesión</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Crear cuenta</button>
      </div>

      <!-- Formulario Login -->
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Usuario o correo electrónico</label>
          <input type="email" id="login-email" class="form-input" placeholder="usuario@sucden.com.co" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Contraseña</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;font-size:0.8125rem">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#475569">
            <input type="checkbox" id="remember-me" checked> Recordarme
          </label>
          <a href="#" onclick="Toast.info('Recuperación','Contacte al Administrador del Sistema');return false;" style="color:#2563EB;text-decoration:none;font-weight:500">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" id="btn-login" class="btn-submit">
          🔒 Iniciar sesión
        </button>

        <div class="divider">o continúa con</div>

        <button type="button" class="btn-google" onclick="Toast.info('SSO','Acceso Google Habilitado para @sucden.com.co')">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12s.7 2.3 1.9 4.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/></svg>
          Iniciar sesión con Google
        </button>
      </form>

      <!-- Formulario Registro -->
      <form id="form-register" onsubmit="handleRegister(event)" style="display:none">
        <div class="form-group">
          <label class="form-label" for="reg-nombre">Nombre Completo</label>
          <input type="text" id="reg-nombre" class="form-input" placeholder="Ej. Carlos Mendoza" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Correo Electrónico</label>
          <input type="email" id="reg-email" class="form-input" placeholder="usuario@sucden.com.co" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Contraseña</label>
          <input type="password" id="reg-password" class="form-input" placeholder="Mínimo 6 caracteres" required>
        </div>

        <div class="form-group mb-4">
          <label class="form-label" for="reg-rol">Rol Solicitado</label>
          <select id="reg-rol" class="form-input" required>
            <option value="RECEPCION">Recepción de Café</option>
            <option value="CALIDAD">Control de Calidad</option>
            <option value="PRODUCCION">Trilla & Producción</option>
            <option value="BODEGA">Bodega e Inventarios</option>
            <option value="DESPACHOS">Despachos & Exportación</option>
            <option value="GERENCIA">Gerencia / Reportes</option>
            <option value="CONSULTA" selected>Consulta General</option>
          </select>
        </div>

        <button type="submit" id="btn-register" class="btn-submit">
          ✨ Registrar mi Usuario
        </button>
      </form>

      <!-- Configuración URL Backend -->
      <div style="margin-top:1.5rem;text-align:center">
        <button type="button" onclick="toggleConfig()" style="background:none;border:none;color:#64748B;font-size:0.75rem;cursor:pointer">
          ⚙️ Configurar URL Backend Google Apps Script
        </button>
      </div>

      <div id="config-box" style="display:none;margin-top:0.75rem;padding:0.75rem;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px">
        <label style="font-size:0.75rem;color:#475569;display:block;margin-bottom:4px">URL de la WebApp:</label>
        <input type="url" id="api-url-input" class="form-input" style="font-size:0.75rem;padding:6px 10px" placeholder="https://script.google.com/macros/s/.../exec">
        <div style="display:flex;gap:6px;margin-top:6px">
          <button type="button" onclick="saveApiUrl()" style="flex:1;padding:6px;font-size:0.75rem;background:#2563EB;color:#FFF;border:none;border-radius:6px;cursor:pointer">Guardar</button>
          <button type="button" onclick="testApiUrl()" style="padding:6px 12px;font-size:0.75rem;background:#E2E8F0;color:#0F172A;border:none;border-radius:6px;cursor:pointer">Probar</button>
        </div>
      </div>

      <div style="margin-top:2rem;font-size:0.75rem;color:#94A3B8;text-align:center">
        © 2026 Sucden Colombia S.A.S. Todos los derechos reservados.
      </div>
    </div>
  </div>

  <script src="src/services/api.js"></script>
  <script src="src/services/auth.js"></script>
  <script src="src/components/ui.js"></script>
  <script>
    if (Auth.isLoggedIn()) {
      window.location.href = 'app.html';
    }

    document.getElementById('api-url-input').value = API.BASE_URL;

    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
    }

    function toggleConfig() {
      const box = document.getElementById('config-box');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function saveApiUrl() {
      const url = document.getElementById('api-url-input').value.trim();
      if (!url || !url.startsWith('https://script.google.com/')) {
        return Toast.error('URL inválida', 'Debe comenzar por https://script.google.com/...');
      }
      localStorage.setItem('sucden_api_url', url);
      Toast.success('URL Guardada', 'Reiniciando aplicación...');
      setTimeout(() => window.location.reload(), 600);
    }

    async function testApiUrl() {
      const url = document.getElementById('api-url-input').value.trim();
      if (!url) return Toast.error('Requerido', 'Ingrese la URL');
      try {
        const res = await fetch(`${url}?action=health`);
        const data = await res.json();
        if (data.ok) Toast.success('Conexión Exitosa', 'El backend respondió OK.');
        else Toast.error('Error', data.message || 'Respuesta inválida');
      } catch (err) {
        Toast.error('Conexión fallida', 'Verifique los permisos de su WebApp en Apps Script.');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass  = document.getElementById('login-password').value;
      const btn   = document.getElementById('btn-login');

      if (!email || !pass) return Toast.error('Error', 'Ingrese su usuario y contraseña');

      btn.disabled = true;
      btn.innerHTML = '⏳ Autenticando...';

      try {
        await Auth.login(email, pass);
        Toast.success('Acceso Correcto', 'Bienvenido a Sucden Colombia');
        setTimeout(() => window.location.href = 'app.html', 500);
      } catch(err) {
        Toast.error('Acceso denegado', err.message);
        btn.disabled = false;
        btn.innerHTML = '🔒 Iniciar sesión';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const nombre   = document.getElementById('reg-nombre').value.trim();
      const email    = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const rol      = document.getElementById('reg-rol').value;
      const btn      = document.getElementById('btn-register');

      if (!nombre || !email || !password) return Toast.error('Datos incompletos', 'Diligencie todos los campos.');

      btn.disabled = true;
      btn.innerHTML = '⏳ Registrando...';

      try {
        await API.post('register', { nombre, email, password, rol });
        Toast.success('Registro Exitoso', 'Usuario creado. Iniciando sesión...');
        await Auth.login(email, password);
        setTimeout(() => window.location.href = 'app.html', 600);
      } catch (err) {
        Toast.error('Error de registro', err.message);
        btn.disabled = false;
        btn.innerHTML = '✨ Registrar mi Usuario';
      }
    }
  </script>
</body>
</html>
