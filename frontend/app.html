<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sucden Colombia — Sistema de Trazabilidad de Café</title>
  <link rel="stylesheet" href="src/styles/main.css">
  <style>
    .topbar-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .topbar-btn:hover {
      background: #E2E8F0;
      color: #0F172A;
    }
    .topbar-btn-logout {
      background: #FEE2E2;
      color: #991B1B;
      border-color: #FCA5A5;
    }
    .topbar-btn-logout:hover {
      background: #FCA5A5;
      color: #7F1D1D;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- Sidebar Left (Dark Corporate Navy) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand" style="display:flex;align-items:center;gap:12px;padding:20px 16px;border-bottom:1px solid rgba(255,255,255,0.08)">
        <svg width="38" height="38" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" fill="#0F1E36" stroke="#D97706" stroke-width="4"/>
          <path d="M50 20C35 30 30 50 45 75C60 50 65 30 50 20Z" fill="#D97706"/>
          <path d="M50 20C65 30 70 50 55 75C40 50 35 30 50 20Z" fill="#22C55E" opacity="0.85"/>
          <path d="M48 25L52 70" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="brand-text">
          <div class="brand-name" style="font-weight:800;font-size:16px;color:#FFFFFF;letter-spacing:-0.3px">SUCDEN</div>
          <div class="brand-sub" style="font-size:10px;color:#94A3B8;letter-spacing:1.5px;font-weight:600">COLOMBIA S.A.S.</div>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav"></nav>

      <div class="sidebar-footer" style="padding:16px;border-top:1px solid rgba(255,255,255,0.08)">
        <div id="sidebar-user"></div>
        <button class="btn btn-outline btn-sm mt-2" style="width:100%;justify-content:center;margin-top:10px;color:#E2E8F0;border-color:rgba(255,255,255,0.2)" onclick="Auth.logout()">
          🚪 Cerrar Sesión
        </button>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper" id="main-wrapper">
      <!-- Topbar Header (Clean White) -->
      <header class="topbar" style="background:#FFFFFF;border-bottom:1px solid #E2E8F0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px">
        <div style="display:flex;align-items:center;gap:16px">
          <button class="topbar-toggle" id="sidebar-toggle" title="Contraer menú" style="background:none;border:none;font-size:20px;color:#334155;cursor:pointer">☰</button>
          
          <div class="page-breadcrumb" style="font-size:14px;color:#64748B;display:flex;align-items:center;gap:8px">
            <span style="font-weight:600;color:#0F172A">Sucden Colombia</span>
            <span>/</span>
            <span class="breadcrumb-current" id="breadcrumb-current" style="color:#2563EB;font-weight:600">Dashboard</span>
          </div>
        </div>

        <div class="topbar-actions" style="display:flex;align-items:center;gap:8px">
          <button class="topbar-btn" onclick="Router.navigate('novedades')" title="Novedades">
            ⚠️ Novedades
          </button>
          <button class="topbar-btn" onclick="Modal.open('modal-config-api')" title="Configurar API WebApp">
            ⚙️ API Config
          </button>
          <button class="topbar-btn topbar-btn-logout" onclick="Auth.logout()" title="Cerrar Sesión">
            🚪 Salir
          </button>
        </div>
      </header>

      <!-- Page Content Viewport -->
      <main class="page-content" id="page-content" style="background:#F8FAFC;padding:24px;min-height:calc(100vh - 64px)">
        <div class="loading-overlay">
          <div class="spinner" style="width:36px;height:36px"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal Configuración API Backend -->
  <div class="modal-backdrop modal-sm" id="modal-config-api">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">⚙️ URL Backend Google Apps Script</h3>
        <button class="modal-close" onclick="Modal.close('modal-config-api')">✕</button>
      </div>
      <div class="modal-body">
        <p class="fs-xs text-muted mb-4">Ingrese la URL obtenida al desplegar el Web App en Apps Script.</p>
        <div class="form-group">
          <label class="form-label" for="api-url-input">URL del WebApp</label>
          <input type="url" id="api-url-input" class="form-control" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="Modal.close('modal-config-api')">Cancelar</button>
        <button class="btn btn-gold" onclick="saveApiUrl()">Guardar URL</button>
      </div>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="src/services/api.js"></script>
  <script src="src/services/auth.js"></script>
  <script src="src/utils/formatters.js"></script>
  <script src="src/components/ui.js"></script>
  <script src="src/components/router.js"></script>

  <!-- Page Modules -->
  <script src="src/pages/dashboard.js"></script>
  <script src="src/pages/recepcion.js"></script>
  <script src="src/pages/lotes.js"></script>
  <script src="src/pages/calidad.js"></script>
  <script src="src/pages/produccion.js"></script>
  <script src="src/pages/inventario.js"></script>
  <script src="src/pages/empaque.js"></script>
  <script src="src/pages/despachos.js"></script>
  <script src="src/pages/documentos.js"></script>
  <script src="src/pages/novedades.js"></script>
  <script src="src/pages/reportes.js"></script>
  <script src="src/pages/administracion.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAuth()) return;

      buildSidebar();
      initSidebarToggle();
      Router.init();

      const input = document.getElementById('api-url-input');
      if (input) input.value = API.BASE_URL;
    });

    function saveApiUrl() {
      const val = document.getElementById('api-url-input').value.trim();
      if (val) {
        API.setBaseUrl(val);
      }
    }
  </script>
</body>
</html>
